# Fails if a credential (API key, private key, token) is committed. Scans the full git history
# on every push and PR with the gitleaks CLI (no third-party action permissions needed).
name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.24.3
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
